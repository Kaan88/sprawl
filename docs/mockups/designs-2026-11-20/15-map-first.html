<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15 Map first</title><link rel="stylesheet" href="kit.css"><style>.narrow .th>:nth-child(2),.narrow .tr>:nth-child(2),.narrow .th>:nth-child(5),.narrow .tr>:nth-child(5){display:none}.narrow .th,.narrow .tr{grid-template-columns:minmax(0,1fr) 70px 46px}</style></head><body><div class="stage"><div class="win" id="w"></div></div><script src="kit.js"></script><script>
const types=K.TYPES.slice(0,9).map((t,i)=>`<span class="chip ${i===0?'on':''}"><i class="sw" style="background:${t[3]}"></i>${t[0]} <span class="dim num">${t[1].toFixed(1)} GB</span></span>`).join('');
const left=`<div class="card col" style="width:340px;flex:none"><div class="row g8 pad12" style="padding-bottom:4px"><span class="semi fill">Folders</span>${K.ibtn('E8A9')}${K.ibtn('E8CB')}</div>${K.tree({sel:3}).replace('t-tree','t-tree narrow')}</div>`;
const right=`<div class="col fill g8" style="min-width:0">
 <div class="row g8"><div class="seg">${K.btn('Treemap','F0E2','on')}${K.btn('City','E80F')}${K.btn('Galaxy','E7FC')}</div><div class="row g4 dim2" style="padding:0 8px">${K.ic('EDA2','s')}C: ${K.ic('E76C','s')} Users ${K.ic('E76C','s')} sam ${K.ic('E76C','s')} <b style="color:var(--tx)">AppData</b></div><span class="sp"></span>${K.ibtn('E8A3')}${K.ibtn('E71F')}${K.ibtn('E790')}${K.ibtn('E713')}${K.ibtn('E81C')}</div>
 <div class="fill">${K.tm({aspect:2.1,hot:'Docker'})}</div>
 <div class="card pad row g8" style="flex-wrap:wrap;padding:8px 10px"><span class="lbl">File types</span>${types}<span class="chip">+3 more</span></div></div>`;
const hdr=`<div class="row g12" style="padding:4px 12px 10px"><div class="split">${K.btn('Scan C:\\','E721','acc')}<span class="btn acc">${K.ic('E70D','s')}</span></div><div class="fill row g8" style="max-width:460px">${K.usage(82)}<span class="cap dim2 num" style="white-space:nowrap">389.4 / 476 GB</span></div><span class="sp"></span>${K.filter(300)}</div>`;
document.getElementById('w').innerHTML=K.tb()+K.tabs('pivot',null,0).replace('class="tabs pivot"','class="tabs pivot" style="padding:0 12px"')+hdr+`<div class="row fill g12" style="padding:0 12px 10px;align-items:stretch;min-height:0">${left}${right}</div>`+K.status();
K.init('15-map-first')</script></body></html>
