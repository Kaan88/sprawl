<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>17 Home dashboard</title><link rel="stylesheet" href="kit.css"><style>
.drv{padding:16px;display:flex;flex-direction:column;gap:12px}
.ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--bar-bg) 0)}
.ring i{width:58px;height:58px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:600}
.gl{display:flex;align-items:center;gap:12px;height:44px;padding:0 4px;border-bottom:1px solid var(--stroke)}.gl:last-child{border:0}
</style></head><body><div class="stage"><div class="win" id="w"></div></div><script src="kit.js"></script><script>
const drv=(l,n,p,free,tot,acc)=>`<div class="card drv fill"><div class="row g16"><div class="ring" style="--p:${p}"><i>${p}%</i></div><div class="fill"><div class="h3">${l} <span class="dim" style="font-weight:400">${n}</span></div><div class="cap dim2 num">${free} free of ${tot}</div><div class="cap dim" style="margin-top:2px">Last scan ${acc}</div></div></div><div class="row g8">${K.btn(acc==='never'?'Scan '+l:'Open last scan','E721',acc==='never'||l==='C:'?'acc':'')}${K.btn('Rescan','E72C','sub')}</div></div>`;
const grew=[['Docker','+3.4 GB'],['Users\\sam\\.cargo','+2.1 GB'],['AppData\\Local\\Temp','+1.8 GB'],['Downloads','+1.2 GB']].map(g=>`<div class="gl">${K.ic('E8B7')}<span class="fill ell">${g[0]}</span><span class="num semi" style="color:var(--orange)">${g[1]}</span></div>`).join('');
const rec=[['D:\\Games','yesterday','1.9 TB'],['C:\\Users\\sam','3 days ago','146.9 GB'],['E:\\Backup','12 days ago','690 GB']].map(g=>`<div class="gl">${K.ic('E81C')}<span class="fill ell">${g[0]}</span><span class="cap dim">${g[1]}</span><span class="num dim2" style="width:70px;text-align:right">${g[2]}</span></div>`).join('');
const sug=K.FIND.slice(0,3).concat(K.FIND.slice(5,6)).map(f=>`<div class="gl"><span class="dot ${f[0]}"></span><span class="fill ell">${f[1]}</span><span class="num semi">${f[3].toFixed(1)} GB</span></div>`).join('');
const main=`<div class="col fill" style="min-width:0;padding:0 20px 0 0;overflow:hidden"><div class="row" style="height:84px"><div><div class="h1">Good morning</div><div class="dim2">C: is 82 % full. Advisor found 46.2 GB you can free.</div></div><span class="sp"></span>${K.filter(260)}</div>
 <div class="row g12" style="margin-bottom:12px">${drv('C:','Windows',82,'86.6 GB','476 GB','8 minutes ago')}${drv('D:','Data',41,'1.2 TB','2.0 TB','yesterday')}${drv('E:','Backup',73,'310 GB','1.0 TB','never')}${`<div class="card drv fill" style="align-items:center;justify-content:center;border-style:dashed;color:var(--tx2)">${K.ic('E710','xl')}<div>Scan a folder...</div><div class="cap dim">or drop one here</div></div>`}</div>
 <div class="row g12 fill" style="align-items:stretch;min-height:0;padding-bottom:16px">
  <div class="card pad col fill"><div class="row"><div class="h3 fill">Grew in the last 7 days</div><span class="cap" style="color:var(--acc)">Colour the map by growth</span></div>${grew}</div>
  <div class="card pad col fill"><div class="row"><div class="h3 fill">Recent scans</div></div>${rec}</div>
  <div class="card pad col fill"><div class="row"><div class="h3 fill">Advisor suggests</div><span class="cap" style="color:var(--acc)">Open Advisor</span></div>${sug}</div></div></div>`;
document.getElementById('w').innerHTML=K.tb()+`<div class="row fill" style="align-items:stretch;min-height:0">${K.rail(0)}${main}</div>`+K.status();
K.init('17-home-dashboard')</script></body></html>
