<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>09 Title-bar search</title><link rel="stylesheet" href="kit.css"><style>
.sug{position:absolute;left:50%;top:34px;width:460px;transform:translateX(-50%);padding:6px;border-radius:8px;z-index:9}
.sug .it{display:flex;gap:10px;align-items:center;height:36px;padding:0 10px;border-radius:4px}.sug .it:hover,.sug .it.on{background:var(--hover)}
</style></head><body><div class="stage"><div class="win" id="w"></div></div><script src="kit.js"></script><script>
const mid=`<div class="input focus" style="width:460px;height:28px;background:var(--card)">${K.ic('E721','s')}<span style="color:var(--tx)">*.mp4;</span><span class="sp"></span><span class="kbd">Ctrl+E</span></div>`;
const sug=`<div class="sug acrylic"><div class="nhead" style="padding-top:4px">Filters</div>
 <div class="it on">${K.ic('E71C')}<span class="fill">*.mp4; <span class="dim">videos, 312 files, 41.2 GB</span></span></div>
 <div class="it">${K.ic('E71C')}<span class="fill">*.mp4;*.mkv;*.avi</span><span class="cap dim">recent</span></div>
 <div class="it">${K.ic('E71C')}<span class="fill">node_modules</span><span class="cap dim">recent</span></div>
 <div class="hdiv"></div><div class="it">${K.ic('E721')}<span class="fill">Search everywhere for “*.mp4”...</span><span class="kbd">Enter</span></div></div>`;
document.getElementById('w').innerHTML=K.classic({tbar:K.tb(mid),tabs:'fill',nofilter:true,top:K.menu,map:'seg'})+sug;
K.init('09-titlebar-search')</script></body></html>
