<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>16 Tree with type strips</title><link rel="stylesheet" href="kit.css"><style>
.t2 .th,.t2 .tr{grid-template-columns:minmax(0,1fr) 230px 80px 52px 66px}
.strip{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:1px;background:var(--bar-bg)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--tx2)}
</style></head><body><div class="stage"><div class="win" id="w"></div></div><script src="kit.js"></script><script>
const C=['#e8708a','#6aa9ff','#b58cff','#f6b042','#5fd3b3','#8893a6'];
const mix=i=>{let a=[],s=0;for(let k=0;k<6;k++){const v=((i*37+k*53)%29)+(k===(i%6)?40:3);a.push(v);s+=v}return a.map(v=>v/s*100)};
const rows=K.TREE.map((r,i)=>`<div class="tr ${i===3?'sel':''}" style="--rowh:34px"><div class="nm" style="padding-left:${r[0]*16}px"><i class="ic ch">${r[6]?'':(r[5]?'&#xE70D;':'&#xE76C;')}</i><i class="ic fi">${r[6]?'&#xE7C3;':'&#xE8B7;'}</i><span class="ell">${r[1]}</span></div><div class="strip" style="width:${Math.max(30,r[3]*2.3)}px">${mix(i).map((v,k)=>`<i style="flex:${v};background:${C[k]}"></i>`).join('')}</div><div class="rt num semi">${r[2].toFixed(1)} GB</div><div class="rt num dim2">${r[3]} %</div><div class="rt num dim">${r[4]}</div></div>`).join('');
const table=`<div class="card col fill t2" style="min-width:0"><div class="row g12 pad12" style="padding-bottom:6px"><div class="seg">${K.btn('Folders','E8B7','on')}${K.btn('File types','E7C3')}</div><span class="sp"></span><div class="legend"><span><i class="sw" style="background:${C[0]}"></i> video</span><span><i class="sw" style="background:${C[1]}"></i> code and libs</span><span><i class="sw" style="background:${C[2]}"></i> images</span><span><i class="sw" style="background:${C[3]}"></i> archives</span><span><i class="sw" style="background:${C[4]}"></i> programs</span><span><i class="sw" style="background:${C[5]}"></i> other</span></div></div>
 <div class="th"><div>Name</div><div>Made of</div><div class="rt">Size</div><div class="rt">%</div><div class="rt">Files</div></div><div class="scroll fill">${rows}</div></div>`;
document.getElementById('w').innerHTML=K.tb()+K.menu+K.hdr()+`<div class="row g12" style="padding:0 12px 6px;min-height:36px">${K.tabs('pivot')}<span class="sp"></span>${K.filter(340)}</div><div class="row g12" style="padding:0 12px 8px;height:300px">${table}</div>`+K.mapbar('seg')+`<div class="fill" style="padding:0 12px 8px">${K.tm({aspect:4.8,hot:'Docker'})}</div>`+K.status();
K.init('16-tree-with-types')</script></body></html>
