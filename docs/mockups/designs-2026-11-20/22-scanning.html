<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>22 Scanning</title><link rel="stylesheet" href="kit.css"><style>
.bar{height:6px;border-radius:3px;background:var(--bar-bg);overflow:hidden}.bar i{display:block;height:100%;width:62%;background:var(--acc);border-radius:3px}
.ringp{width:18px;height:18px;border-radius:50%;border:2px solid var(--acc);border-right-color:transparent;display:inline-block}
.stat{display:flex;flex-direction:column}
</style></head><body><div class="stage"><div class="win" id="w"></div></div><script src="kit.js"></script><script>
const tops=[['Users',104.2],['Windows',38.0],['Program Files',31.4],['ProgramData',9.9],['Program Files (x86)',9.1]].map(t=>`<div class="row g12" style="height:30px"><span class="ell" style="width:150px">${t[0]}</span><div class="fill pcbar"><i style="width:${t[1]/104.2*100}%"></i></div><span class="num semi" style="width:76px;text-align:right">${t[1].toFixed(1)} GB</span></div>`).join('');
const main=`<div class="col fill g12" style="min-width:0;padding:0 12px 10px 0"><div class="row" style="height:48px"><div class="h2">Scanning C:\\</div><span class="sp"></span>${K.btn('Stop','E71A','')}</div>
 <div class="ib w">${K.ic('E7BA')}<span class="fill"><span class="t">Reading as a normal user.</span> <span class="m">Windows and ProgramData are partly closed to you; elevated access finds more.</span></span>${K.btn('Restart as admin','','sm')}</div>
 <div class="card pad16 col g12"><div class="row g12"><span class="ringp"></span><span class="semi">Reading C:\\Users\\sam\\AppData\\Local\\Packages\\Microsoft.Windows...</span><span class="sp"></span><span class="h3 num">62 %</span></div><div class="bar"><i></i></div>
 <div class="row g16"><div class="stat"><span class="lbl">Items</span><span class="h3 num">882,114</span></div><div class="stat"><span class="lbl">Per second</span><span class="h3 num">168 k</span></div><div class="stat"><span class="lbl">Found so far</span><span class="h3 num">241.6 GB</span></div><div class="stat"><span class="lbl">Elapsed</span><span class="h3 num">0:05</span></div><div class="stat"><span class="lbl">About</span><span class="h3 num">3 s left</span></div></div></div>
 <div class="row g12 fill" style="align-items:stretch;min-height:0"><div class="card pad col" style="width:420px;flex:none"><div class="h3" style="margin-bottom:8px">Biggest so far</div>${tops}</div><div class="card col fill pad8" style="min-width:0">${K.tm({aspect:1.9,flat:true})}</div></div></div>`;
document.getElementById('w').innerHTML=K.tb()+`<div class="row fill" style="align-items:stretch;min-height:0">${K.rail(1)}${main}</div>`+`<div class="status"><span>${K.ic('E916')} Scanning</span><div class="sp"></div><span>241.6 GB found</span></div>`;
K.init('22-scanning')</script></body></html>
