<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>07 CommandBar</title><link rel="stylesheet" href="kit.css"><style></style></head><body><div class="stage"><div class="win" id="w"></div></div><script src="kit.js"></script><script>
