<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>18 Advisor three columns</title><link rel="stylesheet" href="kit.css"><style>
.gh{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;font-size:12px;color:var(--tx3)}
</style></head><body><div class="stage"><div class="win" id="w"></div></div><script src="kit.js"></script><script>
const list=`<div class="card col" style="width:400px;flex:none;overflow:hidden"><div class="row g8 pad12" style="padding-bottom:6px"><div class="seg fill" style="display:flex">${K.btn('All 9','','on sm fill')}${K.btn('Safe 3','','sm fill')}${K.btn('Check 2','','sm fill')}${K.btn('Careful 4','','sm fill')}</div></div>
 <div class="gh"><span class="dot g"></span>Safe to delete<span class="sp"></span>16.2 GB</div>${K.find({sel:0,from:0,to:3})}
 <div class="gh"><span class="dot a"></span>Takes time to get back<span class="sp"></span>27.9 GB</div>${K.find({sel:-1,from:3,to:5})}
 <div class="gh"><span class="dot o"></span>Look first<span class="sp"></span>20.4 GB</div>${K.find({sel:-1,from:5,to:6})}</div>`;
const det=`<div class="card col g12 pad16 fill" style="min-width:0"><div class="row g12"><span class="tileicon" style="background:var(--ok-bg);color:var(--ok)">${K.ic('E74D','l')}</span><div class="fill"><div class="h2">npm cache</div><div class="cap dim">C:\\Users\\sam\\AppData\\Local\\npm-cache</div></div><span class="pill g">Safe to delete</span></div>
 <div class="row g16"><div><div class="big-num num">9.8 GB</div><div class="cap dim">52,114 files</div></div><div><div class="semi">Not touched for 94 days</div><div class="cap dim">Last used by npm 10.2</div></div></div>
 <div class="ib i" style="min-height:0">${K.ic('E946')}<span class="m">npm downloads these again the next time a project needs them. Nothing you wrote is in here.</span></div>
 <div><div class="lbl" style="margin-bottom:6px">What is in it</div><div style="height:90px">${K.tm({aspect:5.5,only:['Users'],labels:false})}</div></div>
 <div class="expander"><div class="eh">${K.ic('E756')}<span class="fill semi">Show the command</span>${K.ic('E70D','s')}</div></div>
 <div class="sp"></div><div class="row g8">${K.btn('Show in tree','E8B7')}${K.btn('Look first','E7B3')}${K.btn('Keep it','E73A')}<span class="sp"></span>${K.btn('Clean this','EA99','acc')}</div></div>`;
const chat=`<div class="card col" style="width:330px;flex:none"><div class="row g8 pad12"><span class="avatar">${K.ic('E8BD')}</span><span class="semi fill">Ask your disk</span>${K.ibtn('E8A0')}</div>
 <div class="col g8 fill pad12" style="padding-top:0;overflow:hidden"><div class="bubble me">Why is Docker so big?</div><div class="bubble">The Docker Desktop disk image (<b>21.6 GB</b>) grows with images and volumes but never shrinks by itself. Pruning unused images usually frees 8 to 14 GB.</div><div class="bubble me">Is it safe to prune?</div><div class="bubble">Containers that are stopped lose their data. Running ones are untouched. I can propose the command and you approve it.</div></div>
 <div class="row g8 pad12"><div class="input fill" style="min-width:0">Ask about this scan...</div>${K.ibtn('E724','acc')}</div></div>`;
const foot=`<div class="row g12" style="padding:10px 12px;border-top:1px solid var(--stroke)"><span class="cbx on">&#xE73E;</span><span><b>3 ticked</b>, <span class="num">16.2 GB</span></span><span class="cap dim">Held back by the safety checks: 0</span><span class="sp"></span>${K.btn('Tick all safe','E762')}${K.btn('Review and approve','E73E','acc')}</div>`;
document.getElementById('w').innerHTML=K.tb()+`<div class="row fill" style="align-items:stretch;min-height:0">${K.rail(3)}<div class="col fill" style="min-width:0"><div class="row" style="height:56px;padding-right:12px"><div class="h2">Advisor</div><span class="pill i" style="margin-left:10px">9 findings</span><span class="sp"></span>${K.btn('Check again','E72C')}</div><div class="row g12 fill" style="padding:0 12px 10px 0;align-items:stretch;min-height:0">${list}${det}${chat}</div></div></div>`+foot+K.status();
K.init('18-advisor-3col')</script></body></html>
