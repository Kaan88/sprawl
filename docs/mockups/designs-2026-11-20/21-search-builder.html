<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>21 Search builder</title><link rel="stylesheet" href="kit.css"><style>
.rs .th,.rs .tr{grid-template-columns:22px minmax(0,1fr) 150px 110px 90px 90px}
.q{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:var(--card);border:1px solid var(--stroke);border-bottom:2px solid var(--acc-line);min-height:48px;flex-wrap:wrap}
.chip .ic{font-size:10px;color:var(--tx3)}
</style></head><body><div class="stage"><div class="win" id="w"></div></div><script src="kit.js"></script><script>
const R=[['Season2_Finale_4K.mp4','D:\\Media\\Shows','14.2 GB','412 days','.mp4'],['wedding_raw_cam1.mp4','D:\\Media\\Wedding','9.8 GB','1.9 years','.mp4'],['backup_2023.vhdx','E:\\Backup','8.6 GB','1.1 years','.vhdx'],['Windows11_23H2.iso','D:\\Downloads','6.4 GB','402 days','.iso'],['holiday_drone.mov','D:\\Media\\Trips','5.1 GB','2.4 years','.mov'],['game_capture_0412.mp4','D:\\Media\\Clips','4.7 GB','590 days','.mp4'],['old_project.zip','D:\\Archive','3.9 GB','3.1 years','.zip'],['setup_vs2019.exe','D:\\Downloads','2.8 GB','4.0 years','.exe'],['lecture_recording.mkv','D:\\Media\\Uni','2.4 GB','1.3 years','.mkv']];
const rows=R.map((r,i)=>`<div class="tr ${i===0?'sel':''}" style="--rowh:38px"><span class="cbx"></span><div class="nm"><i class="ic fi" style="color:var(--tx3)">&#xE7C3;</i><div style="min-width:0"><div class="ell semi">${r[0]}</div><div class="cap dim ell">${r[1]}</div></div></div><div class="cap dim2">${r[4]}</div><div class="rt num semi">${r[2]}</div><div class="rt dim2 num">${r[3]}</div><div class="rt">${K.ibtn('E712')}</div></div>`).join('');
const main=`<div class="col fill g12" style="min-width:0;padding:0 12px 10px 0"><div class="row" style="height:48px"><div class="h2">Search</div><span class="sp"></span>${K.btn('Save as filter','E74E')}${K.btn('Clear','E894','sub')}</div>
 <div class="q">${K.ic('E721','s')}<span class="chip on">Larger than 500 MB ${K.ic('E711')}</span><span class="chip on">Older than 1 year ${K.ic('E711')}</span><span class="chip on">Type: video, disk images ${K.ic('E711')}</span><span class="chip on">In: D:\\ and E:\\ ${K.ic('E711')}</span><span class="dim" style="padding-left:6px">add a word or *.ext...</span><span class="sp"></span><span class="btn sub sm">${K.ic('E710','s')} Add filter</span></div>
 <div class="row g8 cap dim2"><span>Same as:</span><code style="background:var(--layer);padding:1px 8px;border-radius:4px;color:var(--tx)">size:&gt;500MB age:&gt;1y type:video,image-disk path:D:\\*;E:\\*</code></div>
 <div class="card col fill rs" style="min-height:0"><div class="row pad12" style="padding-bottom:6px"><span class="semi">86 results</span><span class="cap dim2">62.4 GB in total</span><span class="sp"></span>${K.btn('Sort: size','E8CB','sm sub')}</div><div class="th"><span class="cbx"></span><div>Name</div><div>Type</div><div class="rt">Size</div><div class="rt">Last used</div><div></div></div><div class="scroll fill">${rows}</div></div>
 <div class="selbar"><span class="cbx on">&#xE73E;</span><b>1 selected</b><span class="dim2 num">14.2 GB</span><span class="sp"></span>${K.btn('Show in tree','E8B7','sm')}${K.btn('Show on map','E80F','sm')}${K.btn('Open folder','E838','sm')}${K.btn('Delete...','E74D','sm danger')}</div></div>`;
document.getElementById('w').innerHTML=K.tb()+`<div class="row fill" style="align-items:stretch;min-height:0">${K.rail(5)}${main}</div>`+K.status();
K.init('21-search-builder')</script></body></html>
