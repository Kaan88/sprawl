[workspace]
resolver = "2"
members = ["crates/sprawl-core", "crates/sprawl-advisor", "crates/sprawl", "crates/bindgen"]
default-members = ["crates/sprawl-core", "crates/sprawl-advisor", "crates/sprawl"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
