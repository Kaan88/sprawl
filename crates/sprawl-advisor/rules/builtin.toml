# Built-in rule pack. See src/rules.rs for the format.
#
# Only this pack may carry command text. A command that acts on the matched path must name it as
# {path}; a test checks that no command hard-codes a path.

[pack]
name = "builtin"
version = 1

# ------------------------------------------------------------------ developer caches

[[rule]]
id = "dev.npm-cache"
title = "npm cache"
owner = "npm"
paths = ['%SystemDrive%\Users\*\AppData\Local\npm-cache']
risk = "green"
remedy = "command"
command = "npm cache clean --force"
why = "Packages npm downloaded before. npm fetches them again when a project needs them."

[[rule]]
id = "dev.pip-cache"
title = "pip cache"
owner = "pip"
paths = ['%SystemDrive%\Users\*\AppData\Local\pip\Cache']
risk = "green"
remedy = "command"
command = "pip cache purge"
why = "Wheels and downloads pip keeps to install faster. They are downloaded again when needed."

[[rule]]
id = "dev.cargo-registry"
title = "Cargo registry cache"
owner = "Cargo"
paths = ['%SystemDrive%\Users\*\.cargo\registry\cache', '%SystemDrive%\Users\*\.cargo\registry\src']
risk = "green"
remedy = "delete"
why = "Downloaded crate archives and their unpacked sources. Cargo downloads them again on the next build."

[[rule]]
id = "dev.gradle-cache"
title = "Gradle caches"
owner = "Gradle"
paths = ['%SystemDrive%\Users\*\.gradle\caches']
risk = "green"
remedy = "delete"
why = "Dependencies and build outputs Gradle caches. The next build downloads and rebuilds what it needs."

[[rule]]
id = "dev.nuget-packages"
title = "NuGet package cache"
owner = "NuGet"
paths = ['%SystemDrive%\Users\*\.nuget\packages']
risk = "amber"
remedy = "command"
command = "dotnet nuget locals all --clear"
why = "Packages restored for .NET projects. The next restore downloads them again, which takes a while for big solutions."

[[rule]]
id = "dev.pnpm-store"
title = "pnpm store"
owner = "pnpm"
paths = ['%SystemDrive%\Users\*\AppData\Local\pnpm\store']
risk = "green"
remedy = "command"
command = "pnpm store prune"
why = "Packages pnpm keeps for all projects. Prune removes only the ones no project uses any more."

[[rule]]
id = "dev.yarn-cache"
title = "Yarn cache"
owner = "Yarn"
paths = ['%SystemDrive%\Users\*\AppData\Local\Yarn\Cache']
risk = "green"
remedy = "command"
command = "yarn cache clean"
why = "Packages Yarn downloaded before. It downloads them again when a project needs them."

[[rule]]
id = "dev.go-build-cache"
title = "Go build cache"
owner = "Go"
paths = ['%SystemDrive%\Users\*\AppData\Local\go-build']
risk = "green"
remedy = "command"
command = "go clean -cache"
why = "Compiled packages Go reuses between builds. The next build compiles them again."

[[rule]]
id = "dev.conda-pkgs"
title = "Conda package cache"
owner = "Conda"
paths = ['%SystemDrive%\Users\*\anaconda3\pkgs', '%SystemDrive%\Users\*\miniconda3\pkgs', '%SystemDrive%\ProgramData\anaconda3\pkgs', '%SystemDrive%\ProgramData\miniconda3\pkgs']
risk = "amber"
remedy = "command"
command = "conda clean --all -y"
why = "Package archives and unused packages Conda keeps. Environments keep working; new installs download again."

[[rule]]
id = "dev.huggingface"
title = "Hugging Face model cache"
owner = "Hugging Face"
paths = ['%SystemDrive%\Users\*\.cache\huggingface\hub', '%SystemDrive%\Users\*\.cache\huggingface\datasets']
risk = "amber"
remedy = "delete"
min_bytes = 1073741824
why = "AI models and datasets downloaded by Python tools (your login token is kept). They are downloaded again when used, which can be many GB."

[[rule]]
id = "dev.vscode-cache"
title = "VS Code caches"
owner = "Visual Studio Code"
paths = ['%SystemDrive%\Users\*\AppData\Roaming\Code\Cache', '%SystemDrive%\Users\*\AppData\Roaming\Code\CachedData', '%SystemDrive%\Users\*\AppData\Roaming\Code\CachedExtensionVSIXs']
risk = "green"
remedy = "delete"
why = "Cached web content, old builds and extension downloads. Close VS Code first; it rebuilds them."

[[rule]]
id = "dev.jetbrains-caches"
title = "JetBrains IDE caches"
owner = "JetBrains"
paths = ['%SystemDrive%\Users\*\AppData\Local\JetBrains\*\caches']
risk = "amber"
remedy = "delete"
why = "Indexes JetBrains IDEs build for your projects. Close the IDE first; it re-indexes on the next start, which takes a while."

# ------------------------------------------------------------------ browsers and graphics

[[rule]]
id = "web.firefox-cache"
title = "Firefox cache"
owner = "Mozilla Firefox"
paths = ['%SystemDrive%\Users\*\AppData\Local\Mozilla\Firefox\Profiles\*\cache2']
risk = "green"
remedy = "delete"
min_bytes = 209715200
why = "Web pages Firefox saved to load sites faster. Close Firefox first; it fills the cache again as you browse. Your profile (bookmarks, passwords) is elsewhere and untouched."

[[rule]]
id = "gfx.shader-caches"
title = "Graphics shader cache"
paths = ['%SystemDrive%\Users\*\AppData\Local\NVIDIA\DXCache', '%SystemDrive%\Users\*\AppData\Local\NVIDIA\GLCache', '%SystemDrive%\Users\*\AppData\LocalLow\NVIDIA\PerDriverVersion\DXCache', '%SystemDrive%\Users\*\AppData\Local\AMD\DxCache', '%SystemDrive%\Users\*\AppData\Local\AMD\DxcCache', '%SystemDrive%\Users\*\AppData\Local\AMD\GLCache', '%SystemDrive%\Users\*\AppData\Local\D3DSCache']
risk = "green"
remedy = "delete"
min_bytes = 104857600
why = "Compiled shaders the graphics driver keeps so games load faster. Games compile them again, so the first start of each may stutter briefly."

[[rule]]
id = "games.steam-shadercache"
title = "Steam shader cache"
owner = "Steam"
paths = ['?:\**\steamapps\shadercache']
risk = "green"
remedy = "delete"
min_bytes = 209715200
why = "Shaders Steam pre-compiled for your games. Steam rebuilds them; the first start of each game may take longer."

# ------------------------------------------------------------------ your downloads

[[rule]]
id = "user.old-installers"
title = "Old installer"
paths = ['%SystemDrive%\Users\*\Downloads\*.exe', '%SystemDrive%\Users\*\Downloads\*.msi', '%SystemDrive%\Users\*\Downloads\*.msix']
kind = "file"
risk = "amber"
remedy = "delete"
min_bytes = 52428800
min_age_days = 90
why = "A large program in Downloads, unchanged for over three months. If it was a setup program you ran (or don't need), a current one can be downloaded again. If it is a portable app you still use, keep it."

[[rule]]
id = "user.disc-images"
title = "Disc image"
paths = ['%SystemDrive%\Users\*\Downloads\*.iso']
kind = "file"
risk = "amber"
remedy = "delete"
min_bytes = 524288000
min_age_days = 30
why = "A disc image in Downloads, often used once to install something. Keep it if you made it yourself or can't download it again."

# ------------------------------------------------------------------ virtual disks (information only)

[[rule]]
id = "vm.wsl-disk"
title = "WSL Linux disk"
owner = "WSL"
paths = ['%SystemDrive%\Users\*\AppData\Local\Packages\*\LocalState\ext4.vhdx', '%SystemDrive%\Users\*\AppData\Local\wsl\*\ext4.vhdx']
kind = "file"
risk = "orange"
remedy = "info"
min_bytes = 2147483648
why = "The disk of a Linux distribution. It grows but never shrinks by itself: delete files inside Linux, then run 'wsl --shutdown' and compact the file with Optimize-VHD (Hyper-V) or diskpart's 'compact vdisk' to give the space back. Never delete the file: that deletes the whole distribution."

[[rule]]
id = "vm.docker-disk"
title = "Docker disk"
owner = "Docker Desktop"
paths = ['%SystemDrive%\Users\*\AppData\Local\Docker\wsl\data\ext4.vhdx', '%SystemDrive%\Users\*\AppData\Local\Docker\wsl\disk\docker_data.vhdx', '%SystemDrive%\Users\*\AppData\Local\Docker\wsl\main\ext4.vhdx']
kind = "file"
risk = "amber"
remedy = "info"
min_bytes = 2147483648
why = "Docker's images, containers and volumes. Run 'docker system prune' (add '-a --volumes' to remove more), then shrink the file from Docker Desktop > Troubleshoot or its disk-size setting."

# ------------------------------------------------------------------ Windows

[[rule]]
id = "win.user-temp"
title = "Temporary files"
paths = ['%SystemDrive%\Users\*\AppData\Local\Temp']
risk = "green"
remedy = "command"
action = "clear"
keep_days = 7
why = "Files apps left in the temporary folder. The command only removes what has been untouched for a week (a folder counts by its newest file): newer ones may still be needed by a running installer. Files in use are skipped."

[[rule]]
id = "win.crash-dumps"
title = "Crash dumps"
paths = ['%SystemDrive%\Users\*\AppData\Local\CrashDumps']
risk = "green"
remedy = "delete"
min_bytes = 10485760
why = "Memory dumps written when apps crashed. Only useful for debugging those crashes."

[[rule]]
id = "win.system-crash-dumps"
title = "Windows crash dumps"
owner = "Windows"
paths = ['%SystemRoot%\Minidump', '%SystemRoot%\MEMORY.DMP']
kind = "any"
risk = "green"
remedy = "command"
action = "remove"
admin = true
allow_protected = true
min_bytes = 10485760
why = "Memory dumps Windows wrote when it crashed (blue screens). Only useful for debugging those crashes."

[[rule]]
id = "win.system-temp"
title = "Windows temporary files"
owner = "Windows"
paths = ['%SystemRoot%\Temp']
risk = "green"
remedy = "command"
action = "clear"
keep_days = 7
admin = true
allow_protected = true
min_bytes = 104857600
why = "Files Windows and installers left in the system temporary folder, untouched for a week. Files in use are skipped."

[[rule]]
id = "win.live-kernel-reports"
title = "Kernel reports"
owner = "Windows"
paths = ['%SystemRoot%\LiveKernelReports']
risk = "green"
remedy = "command"
action = "match"
pattern = "*.dmp"
admin = true
allow_protected = true
min_bytes = 104857600
why = "Diagnostic memory dumps Windows writes when a driver hangs. Only useful for debugging that problem."

[[rule]]
id = "win.error-reports"
title = "Windows error reports"
owner = "Windows"
paths = ['%ProgramData%\Microsoft\Windows\WER\ReportArchive', '%ProgramData%\Microsoft\Windows\WER\ReportQueue']
risk = "green"
remedy = "command"
action = "clear"
admin = true
allow_protected = true
min_bytes = 52428800
why = "Crash reports that were sent to Microsoft or are waiting to be sent. Nothing uses them afterwards."

[[rule]]
id = "win.delivery-optimization"
title = "Delivery Optimization cache"
owner = "Windows Update"
paths = ['%SystemRoot%\ServiceProfiles\NetworkService\AppData\Local\Microsoft\Windows\DeliveryOptimization\Cache', '%SystemRoot%\SoftwareDistribution\DeliveryOptimization']
risk = "green"
remedy = "command"
command = "Delete-DeliveryOptimizationCache -Force   # as administrator"
allow_protected = true
min_bytes = 104857600
why = "Update pieces Windows keeps to share with other PCs. Windows downloads them again only if needed."

[[rule]]
id = "win.update-downloads"
title = "Windows Update downloads"
owner = "Windows Update"
paths = ['%SystemRoot%\SoftwareDistribution\Download']
risk = "green"
remedy = "info"
min_bytes = 524288000
why = "Updates already downloaded, most of them installed. Remove them with Settings > System > Storage > Temporary files > Windows Update Cleanup (or Disk Cleanup > Clean up system files). Don't delete the folder by hand while an update is pending."

[[rule]]
id = "win.recycle-bin"
title = "Recycle Bin"
paths = ['%SystemDrive%\$Recycle.Bin']
risk = "amber"
remedy = "command"
command = "Clear-RecycleBin -Force"
allow_protected = true
why = "Files you deleted. The command empties your Recycle Bin on every drive (the size shown is this drive's, for all users). Emptying it can't be undone."

[[rule]]
id = "win.windows-old"
title = "Previous Windows installation"
paths = ['%SystemDrive%\Windows.old']
risk = "amber"
remedy = "command"
command = "Start-Process cleanmgr -ArgumentList \"/d $env:SystemDrive\" -Verb RunAs   # tick 'Previous Windows installation(s)'"
allow_protected = true
why = "The Windows you upgraded from. Removing it means you can't roll back the upgrade."

[[rule]]
id = "win.component-store"
title = "Windows component store cleanup"
owner = "Windows"
paths = ['%SystemRoot%\WinSxS']
risk = "green"
remedy = "command"
command = "DISM /Online /Cleanup-Image /StartComponentCleanup   # as administrator"
allow_protected = true
min_bytes = 4294967296
why = "Superseded component versions. Never delete WinSxS by hand: DISM removes only what is no longer needed. Part of its size is hard links shared with System32, so the real saving is smaller than shown."

# ---------------------------------------------------------------------------------------------
# Cleaners: applications and their parts, shown in the Advisor's Cleaners section. A cleaner
# groups rules above by id, and adds parts of its own (rules with a few more fields).

[[cleaner]]
id = "windows"
name = "Windows"
group = "Windows"
rules = ["win.user-temp", "win.crash-dumps", "win.system-crash-dumps", "win.system-temp", "win.live-kernel-reports", "win.error-reports", "win.delivery-optimization", "win.update-downloads", "win.recycle-bin", "win.windows-old", "win.component-store"]

[[cleaner]]
id = "dev.tools"
name = "Developer tools"
group = "Developer tools"
rules = ["dev.npm-cache", "dev.pip-cache", "dev.cargo-registry", "dev.gradle-cache", "dev.nuget-packages", "dev.pnpm-store", "dev.yarn-cache", "dev.go-build-cache", "dev.conda-pkgs", "dev.huggingface"]

[[cleaner]]
id = "app.vscode"
name = "Visual Studio Code"
group = "Developer tools"
present = ['%APPDATA%\Code']
running = ["Code.exe"]
rules = ["dev.vscode-cache"]

  [[cleaner.part]]
  id = "code-cache"
  title = "Code and GPU caches"
  risk = "green"
  paths = ['%APPDATA%\Code\Code Cache', '%APPDATA%\Code\GPUCache']
  cost = "The window opens a little slower once."
  why = "Compiled scripts and graphics data VS Code makes again when it needs them."

  [[cleaner.part]]
  id = "logs"
  title = "Old logs"
  risk = "green"
  paths = ['%APPDATA%\Code\logs']
  keep_days = 7
  closed = "no"
  cost = "Nothing you would notice."
  why = "Logs of earlier sessions, for troubleshooting. The last week's stay."

[[cleaner]]
id = "app.jetbrains"
name = "JetBrains IDEs"
group = "Developer tools"
present = ['%LOCALAPPDATA%\JetBrains', '%APPDATA%\JetBrains']
rules = ["dev.jetbrains-caches"]

  [[cleaner.part]]
  id = "logs"
  title = "Old logs"
  risk = "green"
  paths = ['%LOCALAPPDATA%\JetBrains\*\log']
  keep_days = 7
  closed = "no"
  cost = "Nothing you would notice."
  why = "IDE logs of earlier sessions. The last week's stay."

[[cleaner]]
id = "app.firefox"
name = "Firefox"
group = "Browsers"
present = ['%APPDATA%\Mozilla\Firefox']
running = ["firefox.exe"]
rules = ["web.firefox-cache"]

  [[cleaner.part]]
  id = "startup"
  title = "Startup cache"
  risk = "green"
  paths = ['%LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\startupCache']
  cost = "Firefox starts a little slower once."
  why = "Firefox's own scripts, prepared for a quick start. Made again on the next start."

  [[cleaner.part]]
  id = "thumbnails"
  title = "Page thumbnails"
  risk = "green"
  paths = ['%LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\thumbnails']
  cost = "New-tab tiles show without pictures for a while."
  why = "Small pictures of pages for the new-tab page."

# Chromium browsers. Their profiles are on the never-list; these caches are allowed only by the
# exact carve-outs in safety.rs (CACHE_CARVE_OUTS): this cleaner's id, a `Default` or
# `Profile N` folder, the folder itself cleared. `Profile *` here may match more (`Profile
# Backup`): the safety check holds those back.
[[cleaner]]
id = "app.chrome"
name = "Google Chrome"
group = "Browsers"
present = ['%LOCALAPPDATA%\Google\Chrome']
running = ["chrome.exe"]

  [[cleaner.part]]
  id = "cache"
  title = "Cache"
  risk = "amber"
  paths = ['%LOCALAPPDATA%\Google\Chrome\User Data\Default\Cache', '%LOCALAPPDATA%\Google\Chrome\User Data\Profile *\Cache', '%LOCALAPPDATA%\Google\Chrome\User Data\Default\Code Cache', '%LOCALAPPDATA%\Google\Chrome\User Data\Profile *\Code Cache', '%LOCALAPPDATA%\Google\Chrome\User Data\Default\GPUCache', '%LOCALAPPDATA%\Google\Chrome\User Data\Profile *\GPUCache']
  action = "clear"
  closed = "must"
  cost = "Pages load a little slower the first time you open them again."
  why = "Pages, images and scripts Chrome saved to load sites faster, scripts it compiled ahead, and shaders compiled for the graphics card. Chrome downloads or makes them again. Sign-ins, cookies, bookmarks, history, passwords, extensions and open tabs are in other files and stay."

[[cleaner]]
id = "app.edge"
name = "Microsoft Edge"
group = "Browsers"
present = ['%LOCALAPPDATA%\Microsoft\Edge']
running = ["msedge.exe"]

  [[cleaner.part]]
  id = "cache"
  title = "Cache"
  risk = "amber"
  paths = ['%LOCALAPPDATA%\Microsoft\Edge\User Data\Default\Cache', '%LOCALAPPDATA%\Microsoft\Edge\User Data\Profile *\Cache', '%LOCALAPPDATA%\Microsoft\Edge\User Data\Default\Code Cache', '%LOCALAPPDATA%\Microsoft\Edge\User Data\Profile *\Code Cache', '%LOCALAPPDATA%\Microsoft\Edge\User Data\Default\GPUCache', '%LOCALAPPDATA%\Microsoft\Edge\User Data\Profile *\GPUCache']
  action = "clear"
  closed = "must"
  cost = "Pages load a little slower the first time you open them again."
  why = "Pages, images and scripts Edge saved to load sites faster, scripts it compiled ahead, and shaders compiled for the graphics card. Edge downloads or makes them again. Sign-ins, cookies, favorites, history, passwords, extensions and open tabs are in other files and stay."

[[cleaner]]
id = "app.brave"
name = "Brave"
group = "Browsers"
present = ['%LOCALAPPDATA%\BraveSoftware\Brave-Browser']
running = ["brave.exe"]

  [[cleaner.part]]
  id = "cache"
  title = "Cache"
  risk = "amber"
  paths = ['%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\Default\Cache', '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\Profile *\Cache', '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\Default\Code Cache', '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\Profile *\Code Cache', '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\Default\GPUCache', '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\Profile *\GPUCache']
  action = "clear"
  closed = "must"
  cost = "Pages load a little slower the first time you open them again."
  why = "Pages, images and scripts Brave saved to load sites faster, scripts it compiled ahead, and shaders compiled for the graphics card. Brave downloads or makes them again. Sign-ins, cookies, bookmarks, history, passwords, extensions and open tabs are in other files and stay."

[[cleaner]]
id = "app.discord"
name = "Discord"
group = "Chat"
present = ['%APPDATA%\discord']
running = ["Discord.exe"]

  [[cleaner.part]]
  id = "cache"
  title = "Cache"
  risk = "green"
  paths = ['%APPDATA%\discord\Cache', '%APPDATA%\discord\Code Cache', '%APPDATA%\discord\GPUCache']
  cost = "Images and emoji load again the first time."
  why = "Copies of pictures, videos and scripts Discord downloaded. It fetches them again."

[[cleaner]]
id = "app.slack"
name = "Slack"
group = "Chat"
present = ['%APPDATA%\Slack']
running = ["slack.exe"]

  [[cleaner.part]]
  id = "cache"
  title = "Cache"
  risk = "green"
  paths = ['%APPDATA%\Slack\Cache', '%APPDATA%\Slack\Code Cache', '%APPDATA%\Slack\GPUCache', '%APPDATA%\Slack\Service Worker\CacheStorage']
  cost = "Pictures and files load again the first time."
  why = "Copies of things Slack downloaded. It fetches them again."

  [[cleaner.part]]
  id = "logs"
  title = "Old logs"
  risk = "green"
  paths = ['%APPDATA%\Slack\logs']
  keep_days = 7
  closed = "no"
  cost = "Nothing you would notice."
  why = "Slack's logs of earlier sessions. The last week's stay."

[[cleaner]]
id = "app.zoom"
name = "Zoom"
group = "Chat"
present = ['%APPDATA%\Zoom']
running = ["Zoom.exe"]

  [[cleaner.part]]
  id = "logs"
  title = "Old logs"
  risk = "green"
  paths = ['%APPDATA%\Zoom\logs']
  keep_days = 7
  closed = "no"
  cost = "Nothing you would notice."
  why = "Zoom's logs of earlier meetings, for troubleshooting. The last week's stay."

[[cleaner]]
id = "app.spotify"
name = "Spotify"
group = "Media"
present = ['%LOCALAPPDATA%\Spotify', '%APPDATA%\Spotify']
running = ["Spotify.exe"]

  [[cleaner.part]]
  id = "storage"
  title = "Song cache"
  risk = "amber"
  paths = ['%LOCALAPPDATA%\Spotify\Storage', '%LOCALAPPDATA%\Spotify\Data']
  closed = "must"
  cost = "Songs stream again, and songs you saved for offline listening download again."
  why = "Songs Spotify kept so they play without downloading. Spotify fills it again as you listen."

  [[cleaner.part]]
  id = "browser"
  title = "Browser cache"
  risk = "green"
  paths = ['%LOCALAPPDATA%\Spotify\Browser\Cache', '%LOCALAPPDATA%\Spotify\Browser\Code Cache', '%LOCALAPPDATA%\Spotify\Browser\GPUCache']
  cost = "Covers and pages load again the first time."
  why = "Pictures and pages the app downloaded."

[[cleaner]]
id = "app.adobe"
name = "Adobe"
group = "Media"
present = ['%APPDATA%\Adobe', '%LOCALAPPDATA%\Adobe']

  [[cleaner.part]]
  id = "media-cache"
  title = "Media cache"
  risk = "amber"
  paths = ['%APPDATA%\Adobe\Common\Media Cache Files', '%APPDATA%\Adobe\Common\Media Cache']
  cost = "Projects open slower once: audio and previews are prepared again."
  why = "Audio and preview files Premiere Pro, After Effects and Audition make from your media. Your media and projects stay."

  [[cleaner.part]]
  id = "acrobat"
  title = "Acrobat cache"
  risk = "green"
  paths = ['%LOCALAPPDATA%\Adobe\AcroCef\DC\Acrobat\Cache']
  cost = "Nothing you would notice."
  why = "Copies of pages and pictures Acrobat's built-in browser downloaded."

[[cleaner]]
id = "app.steam"
name = "Steam"
group = "Games"
present = ['%LOCALAPPDATA%\Steam']
running = ["steam.exe"]
rules = ["games.steam-shadercache"]

  [[cleaner.part]]
  id = "web"
  title = "Store and community cache"
  risk = "green"
  paths = ['%LOCALAPPDATA%\Steam\htmlcache']
  cost = "Store pages load again the first time. You stay signed in."
