[[cleaner]]
id = "app.epic"
name = "Epic Games Launcher"
group = "Games"
present = ['%LOCALAPPDATA%\EpicGamesLauncher']
running = ["EpicGamesLauncher.exe"]

  [[cleaner.part]]
  id = "web"
  title = "Web cache"
  risk = "green"
  paths = ['%LOCALAPPDATA%\EpicGamesLauncher\Saved\webcache*']
  cost = "Store pages load again the first time."
  why = "Pages and pictures the launcher's built-in browser downloaded."

  [[cleaner.part]]
  id = "logs"
  title = "Old logs"
  risk = "green"
  paths = ['%LOCALAPPDATA%\EpicGamesLauncher\Saved\Logs']
  keep_days = 7
  closed = "no"
  cost = "Nothing you would notice."
  why = "The launcher's logs of earlier sessions. The last week's stay."

[[cleaner]]
id = "gfx"
name = "Graphics drivers"
group = "Games"
rules = ["gfx.shader-caches"]
