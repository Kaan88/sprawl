[package]
name = "sprawl-advisor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI-free advisor for Sprawl: findings, rule packs, safety checks and compact scan snapshots."

[dependencies]
sprawl-core = { path = "../sprawl-core" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
sha2 = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = { version = "0.13", features = ["zstdmt"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }
