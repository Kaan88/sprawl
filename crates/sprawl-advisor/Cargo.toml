[package]
name = "sprawl-advisor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI-free advisor for Sprawl: findings, rule packs, safety checks and compact scan snapshots."

[dependencies]
sprawl-core = { path = "../sprawl-core" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zstd = { version = "0.13", features = ["zstdmt"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
