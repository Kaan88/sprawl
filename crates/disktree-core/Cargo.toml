[package]
name = "disktree-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI-free part of DiskTree: disk scanning (NTFS MFT reader + fast directory walk), folder totals, file-type stats, CSV import/export, filters and squarified treemap layout."

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Time",
] }
